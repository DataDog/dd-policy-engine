name: Development
on: [push, workflow_dispatch]

jobs:
  checks:
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-ce3b8e5
    env:
      IN_DOCKER: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make fmt-check

  # TODO: Add MSVC and GCC compilers
  build-linux:
    needs: checks
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-ce3b8e5
    env:
      IN_DOCKER: "true"
      DD_ENV: ci
      # DD_API_KEY: ${{ secrets.DD_API_KEY_CI_APP }}
      DD_SERVICE: dd-policy-engine
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: make test-build
        working-directory: c
        env:
          CC: clang
          CXX: clang
          CMAKE_PRESET: clang-ci
      - run: ctest --test-dir build --output-junit junit.xml
        working-directory: c

  build-windows:
    needs: checks
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Install Dependency Manager and Dependencies
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install main/cmake@4.0.1 main/ninja main/vcpkg main/flatc
      - name: Build
        run: |
          cmake -B build --preset msvc-ci .
          cmake --build build -j
      - name: Run tests
        run: ctest --test-dir build --output-junit junit.xml

  coverage:
    needs: build-linux
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-ce3b8e5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make coverage
        working-directory: c
        env:
          CC: clang
          CXX: clang
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4.0.1
      #   with:
      #     files: coverage.lcov
      #     name: github-actions
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     slug: DataDog/dd-policy-engine
      #     os: alpine
      #     fail_ci_if_error: true
