name: Development
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

env: 
  # Override the `DOCKER_IMAGE` variable in Makefile.docker  
  # This makes all Makefile targets use the specified Docker image instead of building a new one.
  DOCKER_IMAGE: datadog/docker-library:dd-policy-engine-88ce93f
  BUILD_CONTAINER: false

jobs:
  fmt-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make fmt-check

  build-libpolicies-linux:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DD_ENV: ci
      DD_SERVICE: dd-policy-engine
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: dd-policy-engine-ci-vis
      - name: Build
        run: make docker-run "make -C c test-build"
        env:
          DOCKER_ENVARS: "-e CMAKE_PRESET=${{ matrix.toolchain }}-ci"
      - name: Run Tests
        run: make docker-run "./c/build/c/src/test/dd-policy-engine.unit-tests --random-order --output test-report.xml"
        env:
          DOCKER_ENVARS: "-e LSAN_OPTIONS=suppressions=.lsan.supp"
      - name: Report test coverage
        uses: datadog/junit-upload-github-action@8bd322523583035e871786a19832d75127064227 # v3.5.0
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: c/build/test-report.xml
          service: libpolicies
          tags: test.source.file:test/*.cpp

  # Use another job for Go because we just need to build on amd64 and x64
  build-go-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # sh -c keeps both commands inside the container: docker-run does not wrap
      # its argument in a shell, so a bare `make -C go && make -C go test` would
      # run the second half on the host, outside the build image.
      - name: Build and test Go
        run: make docker-run "sh -c 'make -C go && make -C go test'"

  # Cross-engine conformance: runs the shared corpus through both the Go engine
  # and the real C engine (libpolicies, via cgo) in one process and asserts they
  # agree. Requires the C toolchain + flatcc, so it runs inside the build container.
  conformance-cross-engine:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run cross-engine conformance
        run: make docker-run "make -C go conformance-cross"

  # Dedicated job for building dd-compile-policy
  build-dd-compile-policy:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    environment:
      name: dev-env
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build dd-compile-policy
        run: make build-dd-compile-policy
      - name: Export dd-compile-policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dd-compile-policy-linux-${{ matrix.arch }}
          path: dd-compile-policy/bin/dd-compile-policy

  # Build dd-compile-policy for Windows using native runners
  build-dd-compile-policy-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    environment:
      name: dev-env
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - name: Install Dependency Manager (scoop)
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install Dependencies
        run: scoop install main/cmake@4.0.1 main/make@4.4.1
      - name: Build dd-compile-policy
        run: make -C dd-compile-policy build CMAKE_ARCH=${{ matrix.arch }}
      - name: Export dd-compile-policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dd-compile-policy-windows-${{ matrix.arch }}
          path: dd-compile-policy/bin/dd-compile-policy.exe

  # TODO: add arch and vs versions
  build-libpolicies-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DD_ENV: ci
      DD_SERVICE: dd-policy-engine
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: dd-policy-engine-ci-vis
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install Dependency Manager (scoop)
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install Dependencies
        run: scoop install main/cmake@4.0.1
      - name: Build
        run: |
          cmake -B build --preset msvc-ci .
          cmake --build build -j
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
      - name: Run tests
        run: ctest --test-dir build --output-junit test-report.xml
        timeout-minutes: 2
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
      - name: Download datadog-ci
        run: Invoke-WebRequest -Uri "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_win-x64" -OutFile "datadog-ci.exe"
      - name: Report test coverage
        run: ./datadog-ci.exe junit upload build/test-report.xml
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}

  build-go-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Dependency Manager (scoop)
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install make
        run: scoop install main/make@4.4.1
      - name: Test Go
        run: make -C go test

  coverage:
    needs: build-libpolicies-linux
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: dd-policy-engine-ci-vis
      - run: make docker-run "make -C c coverage"
      - name: Upload coverage reports to Datadog
        run: |
          curl -L --fail "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-arm64" --output "/tmp/datadog-ci"
          chmod +x /tmp/datadog-ci
          mv c/coverage/coverage.lcov c/coverage/lcov.info
          /tmp/datadog-ci coverage upload c/coverage/lcov.info
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
