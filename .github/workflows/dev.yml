name: Development
on: [push, workflow_dispatch]

jobs:
  checks:
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-dfbb306
    env:
      IN_DOCKER: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make fmt-check

  # TODO: Add GCC compiler
  build-linux:
    needs: checks
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-dfbb306
    environment:
      name: protected-main-env
    permissions:
      contents: read
      packages: read
    env:
      IN_DOCKER: "true"
      DD_ENV: ci
      DD_API_KEY: ${{ secrets.DD_API_KEY_CI_VIS_APP }}
      DD_SERVICE: dd-policy-engine
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: make test-build
        working-directory: c
        env:
          CC: clang
          CXX: clang
          CMAKE_PRESET: clang-ci
      - run: ctest --test-dir build --output-junit test-report.xml
        working-directory: c
      - name: Report test coverage
        run: |
          curl -L --fail "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" --output "/tmp/datadog-ci"
          chmod +x /tmp/datadog-ci
          /tmp/datadog-ci junit upload c/build/test-report.xml

  # TODO: add arch and vs versions
  build-windows:
    needs: checks
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    env:
      DD_ENV: ci
      # DD_API_KEY: ${{ secrets.DD_API_KEY_CI_APP }}
      DD_SERVICE: dd-policy-engine
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Install Dependency Manager (scoop)
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install Dependencies
        run: | 
          scoop install main/cmake@4.0.1 main/ninja main/vcpkg main/flatc
          $vcpkgPath = scoop prefix vcpkg
          echo "VCPKG_ROOT=$vcpkgPath" >> $env:GITHUB_ENV
      - name: Build
        run: |
          cmake -B build --preset msvc-ci .
          cmake --build build -j
      - name: Run tests
        run: ctest --test-dir build --output-junit test-report.xml
      - name: Report test coverage
        run: |
          Invoke-WebRequest -Uri "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_win-x64" -OutFile "datadog-ci.exe"
          Start-Process -FilePath "./datadog-ci.exe" -ArgumentList "upload build/test-report.xml"

  coverage:
    needs: build-linux
    runs-on: ubuntu-22.04
    container:
      image: datadog/docker-library:dd-policy-engine-dfbb306
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make coverage
        working-directory: c
        env:
          CC: clang
          CXX: clang
      - name: Upload coverage reports
        run: |
          curl -L --fail "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" --output "/tmp/datadog-ci"
          chmod +x /tmp/datadog-ci
          /tmp/datadog-ci coverage upload c/coverage/filtered.info
